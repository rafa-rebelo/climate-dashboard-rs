name: Coleta Hidrometeorológica RS

on:
  schedule:
    # Minutos deslocados do :00 — crons no minuto cheio sofrem mais
    # throttle/drop no GitHub (observado: */10 executava a cada 2-4h)
    - cron: "7,27,47 * * * *"
  workflow_dispatch:          # disparo manual

concurrency:
  group: collect-rs
  cancel-in-progress: true   # evita runs sobrepostos se o anterior ainda estiver rodando

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Coleta de dados (timeout 12 min)
  # ─────────────────────────────────────────────
  collect:
    name: Coletar dados
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      SUPABASE_DATABASE_URL:        ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DATABASE_URL_POOLER: ${{ secrets.SUPABASE_DATABASE_URL_POOLER }}
      R2_ACCESS_KEY_ID:             ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY:         ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL:              ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME:               ${{ secrets.R2_BUCKET_NAME }}
      CF_WORKER_URL:                ${{ secrets.CF_WORKER_URL }}
      ANA_IDENTIFICADOR:            ${{ secrets.ANA_IDENTIFICADOR }}
      ANA_SENHA:                    ${{ secrets.ANA_SENHA }}
      NASA_USER:                    ${{ secrets.NASA_USER }}
      NASA_PASS:                    ${{ secrets.NASA_PASS }}
      TELEGRAM_TOKEN:               ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Lista enxuta: requirements.txt completo puxa torch (~2GB) + CUDA +
      # streamlit/fastapi, inúteis na coleta e que arriscam o timeout de 12min.
      - name: Instalar dependências
        run: pip install -r requirements-collect.txt

      - name: Coletar níveis dos rios (ANA HidroWeb)
        continue-on-error: true
        run: python src/collectors/ana_collector.py

      - name: Coletar estações e chuva (INMET)
        continue-on-error: true
        run: python src/collectors/inmet_collector.py --mode=historico --dias=30

      # gpm_collector usa earthaccess.login(strategy="netrc") — sem este arquivo
      # o login NASA falha e o coletor cai no fallback CHIRPS (lag de 5-7 semanas)
      - name: Configurar .netrc NASA Earthdata
        run: |
          printf 'machine urs.earthdata.nasa.gov\nlogin %s\npassword %s\n' "$NASA_USER" "$NASA_PASS" > ~/.netrc
          chmod 600 ~/.netrc

      # --dias=2: janela maior reduz queda para CHIRPS quando o granule
      # IMERG Early mais recente (latência ~4-6h) ainda não foi publicado.
      - name: Coletar precipitação satélite (GPM IMERG NASA)
        continue-on-error: true
        run: python src/collectors/gpm_collector.py --dias 2

      - name: Coletar previsões NWP (Open-Meteo / NOAA)
        continue-on-error: true
        run: python src/collectors/noaa_collector.py

      - name: Calcular acumulados de chuva
        continue-on-error: true
        run: python src/processors/rain_accumulator.py

      # PyTorch CPU (~200MB) para a inferência do LSTM. Wheel fica em cache
      # pip (setup-python cache:pip), então só o 1o run paga o download.
      - name: Instalar PyTorch CPU (inferência ML)
        continue-on-error: true
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Inferência leve (<30s): baixa o .pt do R2, prevê cotas e faz UPSERT
      # em river_ai_forecasts. continue-on-error: se não houver modelo
      # treinado para um rio, grava status=pendente sem quebrar a coleta.
      - name: Inferência LSTM (previsão de cotas)
        continue-on-error: true
        run: python src/models/inference.py

  # ─────────────────────────────────────────────
  # JOB 2 — Alertas Telegram (timeout 3 min)
  # ─────────────────────────────────────────────
  alerts:
    name: Verificar alertas
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: collect
    if: always()   # roda mesmo se collect falhar parcialmente
    env:
      SUPABASE_DATABASE_URL:        ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DATABASE_URL_POOLER: ${{ secrets.SUPABASE_DATABASE_URL_POOLER }}
      TELEGRAM_TOKEN:               ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Lista enxuta: requirements.txt completo puxa torch (~2 GB) e estoura o
      # timeout do job. telegram_bot.py (v4, Supabase) usa apenas estes pacotes.
      - name: Instalar dependências (alertas)
        run: |
          pip install \
            psycopg2-binary==2.9.9 \
            pyyaml==6.0.1 \
            loguru==0.7.2 \
            python-dotenv==1.0.1 \
            niquests==3.19.0 \
            tenacity==8.2.3

      - name: Enviar alertas Telegram
        continue-on-error: true
        run: python src/alerts/telegram_bot.py
